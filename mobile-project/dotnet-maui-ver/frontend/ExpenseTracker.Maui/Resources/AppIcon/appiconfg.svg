<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients for Diamond Facets -->
        <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818CF8" />
            <stop offset="100%" stop-color="#4F46E5" />
        </linearGradient>
        <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#A5B4FC" />
            <stop offset="50%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#4338CA" />
        </linearGradient>
        <linearGradient id="facetGlow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
        <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE68A" />
            <stop offset="100%" stop-color="#F59E0B" />
        </linearGradient>
    </defs>

    <!-- Outer Soft Glow Hexagon / Shield -->
    <path d="M 228,80 L 336,142 L 336,268 L 228,330 L 120,268 L 120,142 Z"
          fill="none" stroke="#6366F1" stroke-width="4" stroke-opacity="0.35" />

    <!-- Diamond Crown (Top Facets) -->
    <!-- Top-Left Facet -->
    <polygon points="228,126 160,186 195,186" fill="#818CF8" opacity="0.9" />
    <!-- Top-Center Facet -->
    <polygon points="228,126 195,186 261,186" fill="url(#facetCenter)" />
    <!-- Top-Right Facet -->
    <polygon points="228,126 261,186 296,186" fill="#C7D2FE" opacity="0.95" />

    <!-- Diamond Pavilion (Bottom Facets) -->
    <!-- Center Pavilion -->
    <polygon points="195,186 261,186 228,306" fill="url(#facetGlow)" />
    <!-- Left Pavilion -->
    <polygon points="160,186 195,186 228,306" fill="#4338CA" opacity="0.85" />
    <!-- Right Pavilion -->
    <polygon points="261,186 296,186 228,306" fill="#312E81" opacity="0.9" />

    <!-- DuoNoPro Emblem Monogram (Stylized Golden Arc) -->
    <path d="M 210,210 C 210,198 220,194 228,194 C 238,194 246,202 246,214 C 246,226 238,234 228,234 L 210,234 Z"
          fill="none" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="210" y1="194" x2="210" y2="234" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round" />

    <!-- AI Sparkle Top-Right (4-point Star) -->
    <path d="M 326,110 Q 326,124 340,124 Q 326,124 326,138 Q 326,124 312,124 Q 326,124 326,110 Z"
          fill="#FDE68A" />

    <!-- Micro Sparkle Bottom-Left -->
    <path d="M 136,290 Q 136,298 144,298 Q 136,298 136,306 Q 136,298 128,298 Q 136,298 136,290 Z"
          fill="#38BDF8" />
</svg>